services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in infra/.env and run: docker compose --env-file infra/.env up -d db}
      POSTGRES_DB: lumen
    volumes:
      - lumen_db_data:/var/lib/postgresql/data

volumes:
  lumen_db_data:
