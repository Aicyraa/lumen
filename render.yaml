# Render Blueprint for Lumen: only the api. The rag-service runs on the operator's machine behind a Tailscale Funnel (README, "Deployment"),
# because it needs ~1 GB of RAM and Render's free plan has 512 MB.
# Web stays on Vercel (apps/web/vercel.json proxies /api and /v1 to the api's onrender.com host); Postgres stays on Supabase.
# Values marked "sync: false" are asked for once, when the Blueprint is first created; afterwards edit them in the dashboard.
# Never put a secret in this file. Region and plan names: https://render.com/docs/blueprint-spec

services:
  # --- api: the only service on Render ---
  - type: web
    name: lumen-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free # 512 MB, spins down after 15 min idle; change to 0.5c-512mb (Starter) for always-on
    numInstances: 1 # exactly one: rate limits and background ingests live in memory
    autoDeployTrigger: "off"
    healthCheckPath: /api/auth/ok
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT # the image says 3000; Render's default for web services is 10000, so pin it
        value: "10000"
      - key: RAG_SERVICE_URL # the Tailscale Funnel address of the rag-service: https://MACHINE.TAILNET.ts.net
        sync: false
      - key: INTERNAL_SECRET # the same value as INTERNAL_SECRET in apps/rag-service/.env.funnel (openssl rand -hex 32)
        sync: false
      # Three hops in front of the api: Vercel's proxy, Cloudflare and Render's load balancer, so the visitor is the third entry of X-Forwarded-For.
      - key: TRUST_PROXY
        value: "3"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: MODEL_KEY_ENCRYPTION_SECRET # exactly 64 hex characters (openssl rand -hex 32); back it up
        sync: false
      - key: DATABASE_URL # Supabase session pooler, api spelling: ...?uselibpqcompat=true&sslmode=require if the plain form fails with a certificate error
        sync: false
      - key: BETTER_AUTH_URL # https://NAME.vercel.app
        sync: false
      - key: DASHBOARD_ORIGIN # https://NAME.vercel.app, exact, no trailing slash
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Limits (docs/AI_BUILD_BRIEF.md rule 9: set by the operator, never hard-coded). Edit before the first deploy.
      - key: MAX_DOCUMENTS_PER_TENANT
        value: "50"
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"
      - key: MAX_REQUESTS_PER_MONTH
        value: "10000"
      - key: MAX_PROJECTS_PER_USER
        value: "10"
      # Social sign-in (optional): add GOOGLE_CLIENT_ID/SECRET and GITHUB_CLIENT_ID/SECRET in the dashboard if you use them.
