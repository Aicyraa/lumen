# Evaluation tools. No dependencies of their own: run with the rag-service interpreter
# (apps/rag-service/.venv: pytest, ruff, psycopg). HTTP uses the standard library only.
[project]
name = "lumen-eval"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
