embedding:
  model: all-MiniLM-L6-v2   # 384 numbers; changing it means changing VECTOR(384) and re-embedding
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41

retrieval:
  candidate_limit: 40
  rrf_rank_constant: 60
  bm25_k1: 1.2
  bm25_b: 0.75

reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  candidate_limit: 30
  batch_size: 16

# Local calibration: eight synthetic campus PDFs; broader validation is still needed.
router:
  k_cheap: 5
  k_expensive: 8
  long_query_words: 25
  hard_words: [compare, difference, versus, vs, "which applies", both, why, exception, unless, except]
  weak_score: 0.30        # below this, the match is weak
  no_answer_score: 0.15   # below this, do not call any model
  escalate_at: 0.25       # low on purpose: a missed escalation costs more than an extra one
  hard_at: 0.50           # at or above this the question is clearly hard

# Model names, endpoints and keys come from the tenant (the request's `models`); LLM_* env is only a dev/test default. No prices here.

llm:
  connect_timeout_seconds: 5
  timeout_seconds: 30           # read timeout per call; a slow model counts as a timeout attempt
  max_output_tokens: 2048
  answer_repair_attempts: 1
  temperature: 0
  omit_temperature_providers: [openai, anthropic]   # their newer models reject a fixed temperature
  rate_limit_retry_seconds: 2   # wait before the single retry after a provider 429
  max_rate_limit_headers: 30    # rate-limit response headers kept per attempt
  max_header_value_chars: 200
  snippet_chars: 200            # Try it only: length of the passage excerpt on a source

messages:
  no_documents: No documents have been uploaded yet.
  not_found: I could not find that in the documents.
