# Single source of truth for dependencies and tool config (requirements.txt was removed).
[project]
name = "lumen-rag-service"
version = "0.1.0"
description = "Lumen RAG service: ingestion, retrieval, routing and LLM calls behind /internal"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=6.2",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "numpy>=2.5",
    "pypdf>=6.2",
    "pyyaml>=6",
    "fastapi>=0.161",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
    "openai>=3.37",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.15"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, import order
ignore = ["E501"]  # the formatter wraps code; long comments and strings are allowed

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # a fixture imported from another test module is reused as an argument
